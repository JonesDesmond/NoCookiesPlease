<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>NoCookiesPlease</h1>
    <p id="site" class="site">…</p>
    <p id="status" class="status">Checking this page…</p>
    <div class="actions">
      <button id="rejectNow" type="button">Reject cookies on this page now</button>
      <button id="toggleBlock" type="button">Block cookies on this site (until browser closes)</button>
    </div>
    <p id="note" class="note"></p>
    <p class="privacy">Fully local: no data is stored, sent, or shared. Blocking is session-only.</p>
    <script src="popup.js"></script>
  </body>
</html>
